<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520">
  <rect width="720" height="520" fill="#f6f6f6"/>
  <g font-family="PingFang SC, Helvetica Neue, sans-serif" fill="#222">
    <text x="48" y="59" font-size="26" font-weight="600">安装 Agent Muster</text>
    <text x="48" y="92" font-size="15" fill="#555">将左侧应用拖入右侧“应用程序”文件夹。</text>
    <path d="M313 185h94m-12-12 12 12-12 12" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="318" font-size="18" font-weight="600">首次打开被系统拦截？</text>
    <text x="48" y="351" font-size="14" fill="#555">点击弹窗中的“完成”，然后前往：</text>
    <text x="48" y="385" font-size="17" font-weight="500">系统设置 → 隐私与安全性 → 仍要打开</text>
    <text x="48" y="418" font-size="14" fill="#555">验证身份后，按提示再次确认打开。</text>
    <text x="48" y="478" font-size="12" fill="#666">本应用未经 Apple 公证，请仅在确认安装包来源可信时允许打开。</text>
  </g>
</svg>
